# Compila Cabina Send y Cabina Retorno para Mac (VST3 + AU, universal) y Windows (VST3),
# genera los instaladores (.pkg y .exe) y los publica en la release "plugins", que es de donde
# los descarga la web. También quedan en la pestaña "Actions", en "Artifacts".
# Cada compilación es una versión nueva (0.1.<número de ejecución>). Se publica también plugins.yml, con la versión y
# la huella de los paquetes, para que la app de escritorio mantenga los plugins al día (app/plugins.js); la app solo
# instala si quien publica lo ha firmado en su Mac (node herramientas/firmar.mjs plugins).
name: Compilar plugins

on:
  push:
    paths: ["plugin/**", ".github/workflows/compilar.yml"]
  workflow_dispatch:

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    # Firma de Apple (opcional). Sin estos secretos se firma "ad-hoc" y macOS pide "Abrir igualmente" al
    # instalar. Con una cuenta de desarrollador de Apple (99 €/año), ver MEMORIA.md §5 para crearlos.
    env:
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      VERSION: 0.1.${{ github.run_number }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: >
          cmake -S plugin -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCABINA_COPY_AFTER_BUILD=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Preparar certificados de Apple
        if: runner.os == 'macOS' && env.MAC_CERT_P12 != ''
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci firma.keychain
          security set-keychain-settings -lut 3600 firma.keychain
          security unlock-keychain -p ci firma.keychain
          security import cert.p12 -k firma.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci firma.keychain >/dev/null
          security list-keychains -d user -s firma.keychain $(security list-keychains -d user | tr -d '"')
          rm cert.p12
          app=$(security find-identity -v -p codesigning firma.keychain | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          inst=$(security find-identity -v firma.keychain | grep -o '"Developer ID Installer: [^"]*"' | head -1 | tr -d '"')
          echo "FIRMA_APP=$app" >> "$GITHUB_ENV"
          echo "FIRMA_PKG=$inst" >> "$GITHUB_ENV"
          echo "Firmando como: $app / $inst"

      - name: Firmar en Mac
        if: runner.os == 'macOS' && env.FIRMA_APP != ''
        run: |
          find build -path "*Release*" \( -name "*.vst3" -o -name "*.component" \) -maxdepth 5 -type d \
            -exec codesign --force --deep --timestamp --options runtime --sign "$FIRMA_APP" {} \;

      - name: Firmar (ad-hoc) en Mac
        if: runner.os == 'macOS' && env.FIRMA_APP == ''
        run: |
          find build -path "*Release*" \( -name "*.vst3" -o -name "*.component" \) -maxdepth 5 -type d \
            -exec codesign --force --deep --sign - {} \;

      - name: Reunir plugins
        run: |
          mkdir -p dist paquetes
          find build -path "*Release*" \( -name "*.vst3" -o -name "*.component" \) -maxdepth 5 -type d \
            -exec cp -R {} dist/ \;
          ls -la dist

      # Instalador .pkg: copia los plugins a /Library/Audio/Plug-Ins. Lo instalado con un .pkg
      # no lleva la marca de cuarentena, así que no hace falta el comando xattr.
      - name: Instalador para Mac (.pkg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p root/Library/Audio/Plug-Ins/VST3 root/Library/Audio/Plug-Ins/Components scripts
          cp -R dist/*.vst3 root/Library/Audio/Plug-Ins/VST3/
          cp -R dist/*.component root/Library/Audio/Plug-Ins/Components/
          # que macOS no "reubique" los plugins si ya hay una copia en otra carpeta
          pkgbuild --analyze --root root comp.plist
          i=0
          while plutil -extract $i xml1 -o /dev/null comp.plist 2>/dev/null; do
            plutil -replace $i.BundleIsRelocatable -bool NO comp.plist; i=$((i+1))
          done
          # refrescar la caché de Audio Units para que el DAW vea el AU nuevo
          printf '#!/bin/sh\nkillall -9 AudioComponentRegistrar 2>/dev/null\nexit 0\n' > scripts/postinstall
          chmod +x scripts/postinstall
          firma=(); [ -n "$FIRMA_PKG" ] && firma=(--sign "$FIRMA_PKG" --timestamp)
          pkgbuild --root root --component-plist comp.plist --scripts scripts "${firma[@]}" \
            --identifier com.cabina.plugins --version "$VERSION" --install-location / paquetes/Cabina-Mac.pkg
          # Notarizar: Apple revisa el instalador y macOS deja de pedir "Abrir igualmente"
          if [ -n "$FIRMA_PKG" ] && [ -n "$APPLE_ID" ]; then
            xcrun notarytool submit paquetes/Cabina-Mac.pkg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple paquetes/Cabina-Mac.pkg
          fi
          (cd dist && zip -qry ../paquetes/Cabina-Mac.zip .)

      # Instalador .exe (Inno Setup): copia los plugins a C:\Program Files\Common Files\VST3
      - name: Instalador para Windows (.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppName=Cabina
          AppVersion=$($env:VERSION)
          AppPublisher=Cabina
          DefaultDirName={commoncf64}\VST3
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallFilesDir={commonappdata}\Cabina
          UninstallDisplayName=Cabina (plugins VST3)
          OutputDir=paquetes
          OutputBaseFilename=Cabina-Windows
          Compression=lzma2
          SolidCompression=yes

          [Languages]
          Name: "es"; MessagesFile: "compiler:Languages\Spanish.isl"

          [Files]
          Source: "dist\*"; DestDir: "{commoncf64}\VST3"; Flags: recursesubdirs createallsubdirs ignoreversion
          "@
          Set-Content -Path cabina.iss -Value $iss -Encoding UTF8
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc cabina.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\* -DestinationPath paquetes\Cabina-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cabina-plugins-${{ runner.os }}
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: cabina-instaladores-${{ runner.os }}
          path: paquetes/

  publicar:
    needs: compilar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cabina-instaladores-*
          merge-multiple: true
          path: paquetes

      - name: Publicar en la release "plugins"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la paquetes
          # Versión y huellas de los paquetes, para las actualizaciones de la app de escritorio
          VERSION=0.1.${{ github.run_number }}
          { echo "version: $VERSION"; echo "files:"
            for f in Cabina-Mac.zip Cabina-Windows.exe; do
              echo "  - url: $f"; echo "    sha512: $(openssl dgst -sha512 -binary "paquetes/$f" | base64 -w0)"
            done; } > paquetes/plugins.yml
          cat paquetes/plugins.yml
          gh release view plugins >/dev/null 2>&1 || gh release create plugins \
            --title "Plugins Cabina" --target "${{ github.sha }}" --latest \
            --notes "Instaladores de Cabina Send y Cabina Retorno. Se actualizan solos con cada cambio en los plugins."
          gh release upload plugins paquetes/* --clobber
          # Copia fija de cada versión, que no se sobrescribe
          gh release view "plugins-v$VERSION" >/dev/null 2>&1 || gh release create "plugins-v$VERSION" \
            --title "Plugins Cabina $VERSION" --target "${{ github.sha }}" --latest=false \
            --notes "Versión $VERSION de los plugins. Huellas en plugins.yml; firma propia en plugins.yml.sig."
          gh release upload "plugins-v$VERSION" paquetes/* --clobber

# Compila Cabina Send y Cabina Retorno para Mac (VST3 + AU, universal) y Windows (VST3)
# cada vez que subes cambios a GitHub. Los plugins aparecen en la pestaña "Actions",
# dentro de cada ejecución, en "Artifacts".
name: Compilar plugins

on:
  push:
  workflow_dispatch:

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: >
          cmake -S plugin -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCABINA_COPY_AFTER_BUILD=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Firmar (ad-hoc) en Mac
        if: runner.os == 'macOS'
        run: |
          find build -path "*Release*" \( -name "*.vst3" -o -name "*.component" \) -maxdepth 5 -type d \
            -exec codesign --force --deep --sign - {} \;

      - name: Reunir plugins
        run: |
          mkdir -p dist
          find build -path "*Release*" \( -name "*.vst3" -o -name "*.component" \) -maxdepth 5 -type d \
            -exec cp -R {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: cabina-plugins-${{ runner.os }}
          path: dist/

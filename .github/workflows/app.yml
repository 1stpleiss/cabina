# Compila la app de escritorio (app/, Electron) para Mac (universal, .dmg) y Windows (.exe) y la publica
# en la release "app", que es de donde la enlaza la web. Sin firma de Apple ni de Windows: macOS pide
# "Abrir igualmente" y Windows "Ejecutar de todas formas" (ver MEMORIA.md §5, "App de escritorio").
# Cada compilación es una versión nueva (0.1.<número de ejecución>) y publica también los archivos con
# los que la app instalada se actualiza sola: latest.yml (Windows), latest-mac.yml y el .zip (Mac).
name: Compilar app

on:
  push:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
          - os: windows-2022
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Ayudante del control remoto (app/control.js): mueve el ratón y pulsa teclas
      - name: Ayudante del control remoto (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p helper/build
          swiftc -O -target arm64-apple-macos11 -o helper/build/arm64 helper/mac.swift
          swiftc -O -target x86_64-apple-macos13 -o helper/build/x86_64 helper/mac.swift
          lipo -create -output helper/build/cabina-control helper/build/arm64 helper/build/x86_64
          rm helper/build/arm64 helper/build/x86_64
          codesign --force -s - helper/build/cabina-control
      - name: Ayudante del control remoto (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p helper/build
          /c/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe -nologo -optimize -target:winexe -out:helper/build/cabina-control.exe helper/win.cs
      - name: Compilar
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.target }} --publish never -c.extraMetadata.version=0.1.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: cabina-app-${{ runner.os }}
          path: |
            app/dist/Cabina-App-*
            app/dist/latest*.yml
          if-no-files-found: error

  publicar:
    needs: compilar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cabina-app-*
          merge-multiple: true
          path: paquetes
      - name: Publicar en la release "app"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la paquetes
          gh release view app >/dev/null 2>&1 || gh release create app \
            --title "Cabina para escritorio" --target "${{ github.sha }}" --latest=false \
            --notes "La app de escritorio de Cabina para Mac y Windows. Se actualiza sola con cada cambio en la app."
          gh release upload app paquetes/* --clobber

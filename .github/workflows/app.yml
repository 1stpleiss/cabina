# Compila la app de escritorio (app/, Electron) para Mac (universal, .dmg) y Windows (.exe) y la publica
# en la release "app", que es de donde la enlaza la web. Sin firma de Apple ni de Windows: macOS pide
# "Abrir igualmente" y Windows "Ejecutar de todas formas" (ver MEMORIA.md §5, "App de escritorio").
name: Compilar app

on:
  push:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
          - os: windows-2022
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Compilar
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: cabina-app-${{ runner.os }}
          path: |
            app/dist/Cabina-App-Mac.dmg
            app/dist/Cabina-App-Windows.exe
          if-no-files-found: error

  publicar:
    needs: compilar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cabina-app-*
          merge-multiple: true
          path: paquetes
      - name: Publicar en la release "app"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la paquetes
          gh release view app >/dev/null 2>&1 || gh release create app \
            --title "Cabina para escritorio" --target "${{ github.sha }}" --latest=false \
            --notes "La app de escritorio de Cabina para Mac y Windows. Se actualiza sola con cada cambio en la app."
          gh release upload app paquetes/* --clobber

# Publica la carpeta web/ en GitHub Pages cada vez que cambia.
# Requisito (una vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar web

on:
  push:
    branches: [main]
    paths: ["web/**", "firma/**", "herramientas/firmar.mjs", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # La web tiene que ir firmada con la llave propia (node herramientas/firmar.mjs web, en el Mac de quien
      # publica): la app y el plugin no cargan una web sin firma. Si falta o no cuadra, no se publica.
      - name: Comprobar la firma de la web
        run: node herramientas/firmar.mjs comprobar
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
